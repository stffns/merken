[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merken"
version = "0.2.0"
description = "Agent-loop layer for persistent memory, built on top of vstash."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jayson Steffens", email = "stffens@gmail.com" }]
keywords = ["agent", "memory", "vstash", "rag", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "vstash>=0.25.0",
    "pydantic>=2",
    # mcp 2.0 renamed FastMCP to MCPServer (mcp.server.mcpserver), which
    # mcp_server.py uses; 1.x lacks that module. Cap at the next major.
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/stffns/merken"
Issues = "https://github.com/stffns/merken/issues"

[project.scripts]
merken = "merken.cli:main"
merken-midloop-dataset = "merken.training.midloop_dataset_cli:main"
merken-mcp = "merken.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["merken"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Style-only simplifications that would churn working code (nested ifs, try/except/pass,
# if/else assignments); everything else in the selected sets is enforced in CI.
ignore = ["SIM102", "SIM105", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `nanogpt` tests require torch and segfault when run in the same
# process as vstash/fastembed (PyTorch + ONNX Runtime conflict on
# macOS; see notes/nanogpt-training-log.md "Mistake 6"). Opt in with
# `pytest -m nanogpt tests/test_nanogpt_classifier.py`.
addopts = "-ra -m 'not nanogpt'"
markers = [
    "nanogpt: tests that load a trained nanoGPT checkpoint (torch-heavy, opt-in)",
]
# pytest-asyncio is not used by merken but is installed in the
# developer's environment. Pin the fixture scope to silence its
# default-unset deprecation warning.
asyncio_default_fixture_loop_scope = "function"
# faiss ships SWIG bindings without __module__ attributes. Suppress
# the upstream DeprecationWarning so we do not mask our own.
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
    "ignore::DeprecationWarning:sys",
]
